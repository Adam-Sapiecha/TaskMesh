name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskmesh_test
          POSTGRES_PASSWORD: taskmesh_test_local_only
          POSTGRES_DB: taskmesh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskmesh_test -d taskmesh_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://taskmesh_test:taskmesh_test_local_only@localhost:5432/taskmesh_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build visitor console
        run: npm ci --prefix web --no-audit --no-fund && npm run build --prefix web
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Unit, PostgreSQL integration and process acceptance tests
        run: cargo test --locked
  images:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build native image without publishing
        run: docker buildx build --platform ${{ matrix.platform }} --tag taskmesh:ci .
