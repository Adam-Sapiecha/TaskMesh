name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskmesh_test
          POSTGRES_PASSWORD: taskmesh_test_local_only
          POSTGRES_DB: taskmesh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskmesh_test -d taskmesh_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://taskmesh_test:taskmesh_test_local_only@localhost:5432/taskmesh_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Format and vet
        run: |
          test -z "$(gofmt -l cmd internal db/embed.go tests)"
          go vet ./...
      - name: Reproduce generated queries
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate -f db/sqlc.yaml
          git diff --exit-code -- internal/storage/queries
      - name: Unit, integration and process acceptance tests with race detector
        run: go test -race -tags=acceptance -count=1 -timeout=180s ./...
      - name: Vulnerability analysis
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build AMD64 and ARM64 images without publishing
        run: docker buildx build --platform linux/amd64,linux/arm64 --tag taskmesh:ci .
